<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ML Study Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Mono',monospace;background:#0e0e0e;color:#e8e4da;min-height:100vh;}

  .layout{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:320px;flex-shrink:0;border-right:1px solid #1e1e1e;overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar-header{padding:24px 20px 16px;border-bottom:1px solid #1e1e1e;}
  .site-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:2px;}
  .site-sub{font-size:10px;color:#555;letter-spacing:0.1em;text-transform:uppercase;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 20px;border-bottom:1px solid #1e1e1e;}
  .stat{background:#161616;border:1px solid #222;border-radius:8px;padding:8px 10px;}
  .stat-num{font-size:20px;font-weight:500;color:#e8e4da;}
  .stat-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:0.07em;margin-top:2px;}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}

  .filters{display:flex;gap:5px;padding:10px 20px;border-bottom:1px solid #1e1e1e;flex-wrap:wrap;}
  .filter-btn{background:transparent;border:1px solid #2a2a2a;color:#666;cursor:pointer;padding:4px 12px;border-radius:20px;font-family:inherit;font-size:10px;transition:all 0.15s;}
  .filter-btn:hover{border-color:#555;color:#bbb;}
  .filter-btn.active{background:#e8e4da;color:#0e0e0e;border-color:transparent;}

  .topics{flex:1;overflow-y:auto;padding:8px 12px;}
  .topic-btn{width:100%;background:transparent;border:1px solid #1e1e1e;border-radius:8px;margin-bottom:5px;cursor:pointer;text-align:left;transition:border-color 0.15s;overflow:hidden;}
  .topic-btn:hover{border-color:#333;}
  .topic-btn.active{border-color:#555;background:#161616;}
  .topic-header{display:flex;align-items:center;gap:8px;padding:10px 12px;}
  .topic-num{font-size:9px;color:#444;min-width:18px;}
  .topic-name{flex:1;font-size:11px;color:#c8c4ba;font-weight:500;line-height:1.4;text-align:left;}
  .topic-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .chevron{font-size:8px;color:#444;transition:transform 0.2s;flex-shrink:0;}
  .chevron.open{transform:rotate(90deg);}

  .sub-items{padding:0 12px 10px 38px;display:flex;flex-direction:column;gap:5px;}
  .sub-item{display:flex;align-items:flex-start;gap:6px;cursor:pointer;padding:4px 6px;border-radius:5px;transition:background 0.1s;}
  .sub-item:hover{background:#1a1a1a;}
  .sub-item.active-sub{background:#1e1e1e;}
  .item-tag{font-size:8px;padding:2px 6px;border-radius:6px;white-space:nowrap;font-weight:500;flex-shrink:0;margin-top:1px;}
  .item-label{font-size:11px;color:#888;line-height:1.4;}
  .item-label.has-link{color:#a0a0a0;}
  .item-label.has-link:hover{color:#e8e4da;}

  /* Main viewer */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .viewer-header{padding:16px 24px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .viewer-title{font-size:14px;color:#e8e4da;font-weight:500;flex:1;}
  .open-btn{background:transparent;border:1px solid #333;color:#888;padding:5px 14px;border-radius:6px;font-family:inherit;font-size:11px;cursor:pointer;transition:all 0.15s;text-decoration:none;display:inline-block;}
  .open-btn:hover{border-color:#666;color:#ccc;}

  .viewer-body{flex:1;overflow:hidden;background:#111;}
  .viewer-body iframe{width:100%;height:100%;border:none;}
  .empty-view{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#333;gap:12px;}
  .empty-view .big{font-family:'Playfair Display',serif;font-size:48px;}
  .empty-view p{font-size:12px;color:#444;}

  /* Scrollbar */
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="site-title">ML Portal</div>
      <div class="site-sub">Picsart Academy · 17 topics</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">11</div>
        <div class="stat-label"><span class="dot" style="background:#1D9E75"></span>done</div>
      </div>
      <div class="stat">
        <div class="stat-num">3</div>
        <div class="stat-label"><span class="dot" style="background:#BA7517"></span>active</div>
      </div>
      <div class="stat">
        <div class="stat-num">3</div>
        <div class="stat-label"><span class="dot" style="background:#555"></span>next</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">all</button>
      <button class="filter-btn" onclick="setFilter('done',this)">done</button>
      <button class="filter-btn" onclick="setFilter('in-progress',this)">in progress</button>
      <button class="filter-btn" onclick="setFilter('upcoming',this)">upcoming</button>
    </div>

    <div class="topics" id="topics-list"></div>
  </div>

  <!-- Viewer -->
  <div class="main">
    <div class="viewer-header" id="viewer-header" style="display:none">
      <div class="viewer-title" id="viewer-title"></div>
      <a class="open-btn" id="viewer-open" href="#" target="_blank">open in new tab ↗</a>
    </div>
    <div class="viewer-body" id="viewer-body">
      <div class="empty-view">
        <div class="big">◎</div>
        <p>select a topic or resource to view</p>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = "https://github.com/bberrium/Picsart-Academy/blob/main/ML/lections/";
const RAW  = "https://raw.githubusercontent.com/bberrium/Picsart-Academy/main/ML/lections/";

function pdfUrl(filename) {
  // Use Google Docs viewer to embed PDFs from GitHub raw
  return "https://docs.google.com/viewer?embedded=true&url=" + encodeURIComponent(RAW + encodeURIComponent(filename));
}

const TOPICS = [
  { id:1,  title:"Foundations of Data Science & NumPy",       status:"done",        pdf:"1. Foundations of Data Science and AI.pdf",
    items:[{type:"pdf",label:"Lecture Slides"}] },
  { id:2,  title:"Data Manipulation with Pandas",              status:"done",        pdf:null, items:[] },
  { id:3,  title:"Data Visualization & Exploration",           status:"done",        pdf:null, items:[] },
  { id:4,  title:"Intro to AI and its Applications",           status:"done",        pdf:null, items:[] },
  { id:5,  title:"KNN",                                        status:"done",        pdf:null,
    items:[
      {type:"read",    label:"KNN Model Notes",              url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/KNN.md"},
      {type:"dataset", label:"Wine Quality Dataset",          url:"https://www.kaggle.com/datasets/yasserh/wine-quality-dataset"},
      {type:"read",    label:"ML Pipelines — Google Devs",   url:"https://developers.google.com/machine-learning/managing-ml-projects/pipelines"},
      {type:"practice",label:"Implement KNN (Colab)",         url:"https://colab.research.google.com/drive/15Ni2FZZIgEiuLFmTkXsI_sJy5mGBUcrJ?usp=sharing"},
    ]},
  { id:6,  title:"Decision Trees, Splitting, Overfitting",     status:"done",        pdf:null,
    items:[
      {type:"read",    label:"Decision Tree Notes",           url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Decision_Tree.md"},
      {type:"dataset", label:"Breast Cancer Dataset",          url:"https://www.kaggle.com/datasets/yasserh/breast-cancer-dataset"},
      {type:"practice",label:"Implement Decision Trees",       url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Decision_Tree.md"},
    ]},
  { id:7,  title:"Perceptron & SVM Conceptuals",               status:"done",        pdf:null,
    items:[
      {type:"read",    label:"Perceptron & SVM Notes",        url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Perceptron_and_SVM_Conceptual.md"},
    ]},
  { id:8,  title:"Linear Regression",                          status:"done",        pdf:null,
    items:[
      {type:"read",    label:"Linear Regression (PDF)",       url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Linear_Regression.pdf"},
      {type:"practice",label:"Implement LR (Colab)",           url:"https://colab.research.google.com/drive/1iaf9PQ78-M2skiMdTY-LeHuRyRjm6wrV"},
    ]},
  { id:9,  title:"GLM & Polynomial Regression",                status:"done",        pdf:null,
    items:[
      {type:"read",    label:"GLM (PDF)",                     url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/GLM.pdf"},
      {type:"read",    label:"Polynomial Regression Notes",    url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Polynomial_Regression.md"},
    ]},
  { id:10, title:"Regularization & Evaluation",                status:"done",        pdf:null,
    items:[
      {type:"read",    label:"ESL: Ch. 3.4.1–3.4.3 (Ridge/Lasso)", url:null},
      {type:"read",    label:"Bishop: Ch. 3.1.4",             url:null},
      {type:"read",    label:"Ridge & Lasso Notes",           url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Ridge_and_Lasso_Regression.md"},
      {type:"read",    label:"Newton's Method",               url:null},
    ]},
  { id:11, title:"Logistic & Locally Weighted Regression",     status:"done",        pdf:null,
    items:[
      {type:"read",    label:"Locally Weighted LR (Stanford Notes 17–27)", url:null},
      {type:"read",    label:"ESL: Ch. 4.4",                  url:null},
      {type:"read",    label:"Bishop: 4.3.1–4.3.3",           url:null},
    ]},
  { id:"11b", title:"TensorFlow & ML Stack",                   status:"done",        pdf:null,
    items:[
      {type:"practice",label:"Intro to TensorFlow",           url:null},
      {type:"practice",label:"Framework Exploration",         url:null},
    ]},
  { id:12, title:"Optimization Algorithms",                    status:"in-progress", pdf:null,
    items:[
      {type:"read",    label:"Optimization Algorithms Notes", url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Optimization_Algorithms.md"},
    ]},
  { id:13, title:"Advanced SVMs & Constrained Optimization",   status:"in-progress", pdf:null,
    items:[
      {type:"read",    label:"Lagrange Multipliers (Lamar)",  url:"https://tutorial.math.lamar.edu/classes/calciii/lagrangemultipliers.aspx"},
      {type:"read",    label:"KKT Conditions (CMU)",          url:"https://www.stat.cmu.edu/~ryantibs/convexopt-F16/scribes/kkt-scribed.pdf"},
      {type:"read",    label:"Bishop: Ch. 7.1 (SVMs)",        url:null},
      {type:"dataset", label:"Credit Card Fraud Dataset",      url:"https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud"},
    ]},
  { id:14, title:"Ensemble Methods",                           status:"in-progress", pdf:null,
    items:[
      {type:"read",    label:"Ensemble Methods (PDF)",        url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Ensemble.pdf"},
      {type:"read",    label:"Bishop: Ch. 14.3.1 (Boosting)", url:null},
    ]},
  { id:15, title:"Generative Modeling",                        status:"upcoming",    pdf:null,
    items:[
      {type:"read",    label:"Generative Learning Algorithms",url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/Generative%20Learning%20Algorithms.pdf"},
    ]},
  { id:16, title:"Clustering",                                 status:"upcoming",    pdf:null,
    items:[
      {type:"read",    label:"K-Means Clustering (PDF)",      url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/K-Means%20Clustering.pdf"},
      {type:"read",    label:"ML Evaluation Metrics",         url:"https://github.com/Hayriyan/Picsart_AI_2.0/blob/main/Models/ML_Evaluation_Metrics.md"},
    ]},
  { id:17, title:"Gaussian Mixture Modeling",                  status:"upcoming",    pdf:null, items:[] },
];

const STATUS_DOT = { done:"#1D9E75", "in-progress":"#BA7517", upcoming:"#444" };
const TAG_STYLE  = {
  pdf:      "background:#E6F1FB;color:#0C447C",
  read:     "background:#E6F1FB;color:#0C447C",
  practice: "background:#FAECE7;color:#712B13",
  dataset:  "background:#EAF3DE;color:#3B6D11",
};

let currentFilter = "all";
let openTopics = {};
let activeItem = null;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleTopic(id) {
  openTopics[id] = !openTopics[id];
  render();
}

function viewPdf(filename, label) {
  activeItem = filename;
  const url = pdfUrl(filename);
  const rawUrl = RAW + encodeURIComponent(filename);
  document.getElementById('viewer-header').style.display = 'flex';
  document.getElementById('viewer-title').textContent = label;
  document.getElementById('viewer-open').href = rawUrl;
  document.getElementById('viewer-body').innerHTML =
    `<iframe src="${url}" allowfullscreen></iframe>`;
  render();
}

function viewUrl(url, label) {
  activeItem = url;
  document.getElementById('viewer-header').style.display = 'flex';
  document.getElementById('viewer-title').textContent = label;
  document.getElementById('viewer-open').href = url;
  document.getElementById('viewer-body').innerHTML =
    `<iframe src="${url}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups"></iframe>`;
  render();
}

function render() {
  const list = document.getElementById('topics-list');
  const filtered = currentFilter === 'all' ? TOPICS : TOPICS.filter(t => t.status === currentFilter);

  list.innerHTML = filtered.map(t => {
    const isOpen = openTopics[t.id];
    const dot = STATUS_DOT[t.status] || "#444";
    const hasChildren = t.pdf || t.items.length > 0;
    const allItems = [];
    if (t.pdf) allItems.push({type:"pdf", label:"Lecture Slides", isPdf:true, filename:t.pdf});
    t.items.forEach(i => allItems.push({...i, isPdf:false}));

    const subHtml = isOpen && allItems.length > 0 ? `
      <div class="sub-items">
        ${allItems.map(item => {
          const tag = TAG_STYLE[item.type] || TAG_STYLE.read;
          const hasAction = item.isPdf || item.url;
          const activeClass = activeItem === (item.isPdf ? item.filename : item.url) ? ' active-sub' : '';
          const onclick = item.isPdf
            ? `viewPdf('${item.filename.replace(/'/g,"\\'")}','${item.label.replace(/'/g,"\\'")}');`
            : item.url ? `viewUrl('${item.url}','${item.label.replace(/'/g,"\\'")}');` : '';
          return `<div class="sub-item${activeClass}" onclick="${onclick}">
            <span class="item-tag" style="${tag}">${item.type}</span>
            <span class="item-label${hasAction?' has-link':''}">${item.label}</span>
          </div>`;
        }).join('')}
      </div>` : '';

    return `<div class="topic-btn${isOpen?' active':''}" >
      <div class="topic-header" onclick="toggleTopic('${t.id}')">
        <span class="topic-num">${String(t.id).padStart(2,'0')}</span>
        <span class="topic-name">${t.title}</span>
        <span class="topic-dot" style="background:${dot}"></span>
        ${hasChildren ? `<span class="chevron${isOpen?' open':''}">▶</span>` : ''}
      </div>
      ${subHtml}
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
