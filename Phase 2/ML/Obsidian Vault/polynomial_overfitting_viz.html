<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Overfitting Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f6f7; color: #333; }
        .dashboard { display: flex; gap: 20px; width: 100%; max-width: 900px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .stats-panel { background: #2c3e50; color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); flex: 1; min-width: 250px; text-align: center; display: flex; flex-direction: column; justify-content: center;}
        .chart-container { width: 100%; max-width: 900px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin: 0 0 10px 0; }
        .metric { font-size: 1.8em; font-weight: bold; color: #e74c3c; margin-top: 10px; }
        input[type=range] { width: 100%; max-width: 300px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="control-panel">
            <h3>Polynomial Degree (m): <span id="degree-val" style="color: #3498db;">3</span></h3>
            <input type="range" id="degreeSlider" min="1" max="12" step="1" value="3">
            <p style="font-size: 0.9em; color: #7f8c8d; text-align: center; margin-top: 15px;">
                Move past degree 3 to see the curve overfit. It will try to hit every point perfectly, sacrificing the true underlying trend.
            </p>
        </div>
        <div class="stats-panel">
            <h3>Training Error (MSE)</h3>
            <div class="metric" id="mse-val">0.00</div>
            <p style="font-size: 0.85em; color: #bdc3c7; margin-top: 10px;">
                Notice how the error keeps dropping even as the line becomes visually ridiculous.
            </p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="regressionChart" height="400"></canvas>
    </div>

    <script>
        // 1. Define the Dataset (Mimicking the skewed Hardwood data)
        const rawData = [
            {x: 1, y: 6}, {x: 2, y: 20}, {x: 3, y: 24}, {x: 4, y: 26}, {x: 4.5, y: 30}, 
            {x: 5, y: 34}, {x: 5.5, y: 38}, {x: 6, y: 40}, {x: 6.5, y: 42}, {x: 7.5, y: 46}, 
            {x: 9, y: 53}, {x: 10, y: 52}, {x: 11, y: 53}, {x: 12, y: 48}, {x: 13, y: 43}, 
            {x: 14, y: 28}, {x: 15, y: 22}
        ];

        // Separate out x and y arrays
        const x_vals = rawData.map(p => p.x);
        const y_vals = rawData.map(p => p.y);

        // MATHEMATICAL SAFETY: Normalize X values between -1 and 1.
        // Without this, calculating x^12 for x=15 yields 129,746,337,890,625.
        // This causes catastrophic precision loss in JS matrices and breaks the inversion.
        const x_min = Math.min(...x_vals);
        const x_max = Math.max(...x_vals);
        function normalizeX(x) { return ((x - x_min) / (x_max - x_min)) * 2 - 1; }
        const x_norm = x_vals.map(normalizeX);

        // 2. Setup the Chart.js Graph
        const ctx = document.getElementById('regressionChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'Polynomial Fit',
                        type: 'line',
                        borderColor: '#e74c3c',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4, // Smooth curve drawing between high-res points
                        data: []
                    },
                    {
                        label: 'Training Data',
                        type: 'scatter',
                        backgroundColor: '#2c3e50',
                        pointRadius: 6,
                        data: rawData
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'X (Feature)' }, min: 0, max: 16 },
                    y: { title: { display: true, text: 'Y (Target)' }, min: -10, max: 70 }
                },
                animation: false // Turn off animation for instant slider updates
            }
        });

        // 3. Calculation and Update Function
        function updateModel() {
            const degree = parseInt(document.getElementById('degreeSlider').value);
            document.getElementById('degree-val').innerText = degree;

            // Build Design Matrix (Phi) using normalized X
            let X_matrix = x_norm.map(x => {
                let row = [];
                for(let j = 0; j <= degree; j++) { row.push(Math.pow(x, j)); }
                return row;
            });
            let Y_matrix = y_vals.map(y => [y]); // Convert to column vector

            let weights = [];
            try {
                // The Normal Equation: w = inv(X^T * X) * X^T * Y
                const Xt = math.transpose(X_matrix);
                const XtX = math.multiply(Xt, X_matrix);
                
                // For very high degrees, even normalized matrices get slightly singular.
                // We add a microscopic amount of noise to the diagonal (Ridge/Tikhonov regularization) 
                // just to prevent math.js from crashing and allow us to see the wild overfitting shape.
                const identity = math.identity(degree + 1).toArray();
                const epsilon = 1e-9;
                const XtX_stable = math.add(XtX, math.multiply(identity, epsilon));

                const XtX_inv = math.inv(XtX_stable);
                const XtY = math.multiply(Xt, Y_matrix);
                const w_matrix = math.multiply(XtX_inv, XtY);
                
                weights = w_matrix.map(row => row[0]); // Flatten to array
            } catch (err) {
                console.error("Matrix inversion failed:", err);
                document.getElementById('mse-val').innerText = "ERR";
                return;
            }

            // Calculate Predictions and MSE
            let mse = 0;
            for(let i = 0; i < x_norm.length; i++) {
                let y_pred = 0;
                for(let j = 0; j <= degree; j++) { y_pred += weights[j] * Math.pow(x_norm[i], j); }
                mse += Math.pow(y_vals[i] - y_pred, 2);
            }
            mse = mse / x_norm.length;
            document.getElementById('mse-val').innerText = mse.toFixed(2);

            // Generate high-resolution points for drawing the smooth curve
            const curveData = [];
            for(let x = 0; x <= 16; x += 0.1) {
                let x_n = normalizeX(x);
                let y_pred = 0;
                for(let j = 0; j <= degree; j++) { y_pred += weights[j] * Math.pow(x_n, j); }
                
                // Cap the visual rendering so it doesn't break the chart boundaries too severely
                if(y_pred > 200) y_pred = null; 
                if(y_pred < -100) y_pred = null;

                if (y_pred !== null) {
                    curveData.push({x: x, y: y_pred});
                }
            }

            // Update Chart
            chart.data.datasets[0].data = curveData;
            chart.update();
        }

        // Attach event listener
        document.getElementById('degreeSlider').addEventListener('input', updateModel);
        
        // Initial render
        updateModel();
    </script>
</body>
</html>
