<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runge's Phenomenon Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f6f7; color: #333; }
        .dashboard { display: flex; gap: 20px; width: 100%; max-width: 900px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; text-align: center; }
        .chart-container { width: 100%; max-width: 900px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin: 0 0 10px 0; color: #2c3e50; }
        input[type=range] { width: 100%; max-width: 400px; margin-top: 10px; cursor: pointer; }
        .desc { font-size: 0.9em; color: #7f8c8d; margin-top: 10px; max-width: 700px; margin-left: auto; margin-right: auto;}
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="control-panel">
            <h3>Number of Nodes (N): <span id="node-val" style="color: #e67e22;">5</span></h3>
            <p style="font-size: 1.1em; font-weight: bold; margin: 5px 0; color: #34495e;">Polynomial Degree: <span id="degree-val">4</span></p>
            <input type="range" id="nodeSlider" min="3" max="15" step="2" value="5">
            <p class="desc">
                The dashed green line is the true function: <b>f(x) = 1 / (1 + 25x²)</b>.<br>
                Increase the number of nodes to fit a higher-degree polynomial. Notice how it fits the center perfectly, but the boundaries begin to whip violently out of control!
            </p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="rungeChart" height="400"></canvas>
    </div>

    <script>
        // 1. Define the True Function (Runge's Function)
        function trueFunction(x) {
            return 1 / (1 + 25 * x * x);
        }

        // Generate high-resolution points for smooth curve drawing
        const x_hires = [];
        for(let x = -1; x <= 1.001; x += 0.01) {
            x_hires.push(parseFloat(x.toFixed(2)));
        }

        // Calculate True Function Y values
        const true_y_vals = x_hires.map(x => ({ x: x, y: trueFunction(x) }));

        // 2. Setup the Chart.js Graph
        const ctx = document.getElementById('rungeChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'True Function f(x)',
                        type: 'line',
                        borderColor: '#2ecc71',
                        borderDash: [5, 5],
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0,
                        data: true_y_vals
                    },
                    {
                        label: 'Polynomial Interpolant',
                        type: 'line',
                        borderColor: '#e67e22',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                        data: []
                    },
                    {
                        label: 'Data Nodes',
                        type: 'scatter',
                        backgroundColor: '#2980b9',
                        pointRadius: 6,
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'X' }, min: -1.05, max: 1.05 },
                    // Lock the Y-axis so the extreme oscillations shoot off-screen,
                    // preserving the scale of the true function in the center.
                    y: { title: { display: true, text: 'Y' }, min: -0.5, max: 2.2 }
                },
                animation: false // Instant rendering on slider move
            }
        });

        // Lagrange Interpolation Formula (Numerically stable way to draw exact polynomials)
        function lagrangeInterpolate(x_target, x_nodes, y_nodes) {
            let y_target = 0;
            for (let i = 0; i < x_nodes.length; i++) {
                let term = y_nodes[i];
                for (let j = 0; j < x_nodes.length; j++) {
                    if (i !== j) {
                        term = term * (x_target - x_nodes[j]) / (x_nodes[i] - x_nodes[j]);
                    }
                }
                y_target += term;
            }
            return y_target;
        }

        // 3. Calculation and Update Function
        function updateModel() {
            const N = parseInt(document.getElementById('nodeSlider').value);
            const degree = N - 1;
            
            document.getElementById('node-val').innerText = N;
            document.getElementById('degree-val').innerText = degree;

            // Generate N equally spaced nodes between -1 and 1
            const nodes = [];
            const x_nodes = [];
            const y_nodes = [];
            
            for(let i = 0; i < N; i++) {
                // Formula for equally spaced points from -1 to 1
                let x = -1 + (2 * i) / (N - 1);
                let y = trueFunction(x);
                x_nodes.push(x);
                y_nodes.push(y);
                nodes.push({ x: x, y: y });
            }

            // Calculate the Polynomial Interpolant curve using Lagrange
            const interpolantData = [];
            for(let i = 0; i < x_hires.length; i++) {
                let x = x_hires[i];
                let y_pred = lagrangeInterpolate(x, x_nodes, y_nodes);
                
                // Cap the visual rendering to prevent drawing completely broken lines
                // if it goes too far to infinity
                if (y_pred > 10) y_pred = null; 
                if (y_pred < -10) y_pred = null;

                if (y_pred !== null) {
                    interpolantData.push({x: x, y: y_pred});
                }
            }

            // Update Chart datasets
            chart.data.datasets[1].data = interpolantData; // The fitted polynomial curve
            chart.data.datasets[2].data = nodes;           // The blue dots
            chart.update();
        }

        // Attach event listener
        document.getElementById('nodeSlider').addEventListener('input', updateModel);
        
        // Initial render
        updateModel();
    </script>
</body>
</html>
