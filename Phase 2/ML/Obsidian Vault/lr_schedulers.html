<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Rate Schedulers Simulator</title>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #0f172a;
        color: #f8fafc;
        padding: 40px 20px;
        margin: 0;
    }
    h2 { margin-bottom: 10px; }
    p { color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 600px; }
    
    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    canvas {
        background: #0f172a;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #334155;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 100%;
        max-width: 600px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    label { font-size: 0.9em; font-weight: 600; color: #cbd5e1; }
    select, input[type=range] {
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #334155;
        color: white;
        cursor: pointer;
    }
    
    .val-display { font-family: monospace; color: #38bdf8; float: right; }
</style>
</head>
<body>

    <h2>Learning Rate Schedulers</h2>
    <p>Visualize how different algorithms adjust the learning rate over 100 training epochs.</p>
    
    <div class="container">
        <canvas id="plot" width="600" height="300"></canvas>
        
        <div class="controls">
            <div class="control-group" style="grid-column: span 2;">
                <label for="scheduler">Scheduler Type</label>
                <select id="scheduler">
                    <option value="triangular">CyclicLR: Triangular</option>
                    <option value="triangular2">CyclicLR: Triangular2</option>
                    <option value="exp_range">CyclicLR: Exp_range</option>
                    <option value="steplr">StepLR (Staircase)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Base LR <span id="base-val" class="val-display">0.001</span></label>
                <input type="range" id="base_lr" min="0.0001" max="0.005" step="0.0001" value="0.001">
            </div>

            <div class="control-group">
                <label>Max LR <span id="max-val" class="val-display">0.010</span></label>
                <input type="range" id="max_lr" min="0.005" max="0.05" step="0.001" value="0.01">
            </div>

            <div class="control-group" style="grid-column: span 2;">
                <label>Step Size (Epochs per half-cycle / Drop interval) <span id="step-val" class="val-display">10</span></label>
                <input type="range" id="step_size" min="5" max="30" step="1" value="10">
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    
    // Inputs
    const typeSelect = document.getElementById('scheduler');
    const baseLrInput = document.getElementById('base_lr');
    const maxLrInput = document.getElementById('max_lr');
    const stepSizeInput = document.getElementById('step_size');

    // Value displays
    const baseVal = document.getElementById('base-val');
    const maxVal = document.getElementById('max-val');
    const stepVal = document.getElementById('step-val');

    // Update numbers on screen
    function updateLabels() {
        baseVal.textContent = parseFloat(baseLrInput.value).toFixed(4);
        maxVal.textContent = parseFloat(maxLrInput.value).toFixed(3);
        stepVal.textContent = stepSizeInput.value;
    }

    // Mathematical formulas for the schedulers
    function calculateLR(epoch, type, base_lr, max_lr, step_size) {
        const cycle = Math.floor(1 + epoch / (2 * step_size));
        const x = Math.abs(epoch / step_size - 2 * cycle + 1);
        
        if (type === 'steplr') {
            // Drops by half every 'step_size' epochs. Starts at max_lr for visibility.
            const drops = Math.floor(epoch / step_size);
            return max_lr * Math.pow(0.5, drops);
        } 
        
        // Base logic for Cyclic variants
        let lr = base_lr + (max_lr - base_lr) * Math.max(0, 1 - x);
        
        if (type === 'triangular') {
            return lr;
        } else if (type === 'triangular2') {
            return base_lr + (max_lr - base_lr) * Math.max(0, 1 - x) / Math.pow(2, cycle - 1);
        } else if (type === 'exp_range') {
            const gamma = 0.95; // Decay factor
            return base_lr + (max_lr - base_lr) * Math.max(0, 1 - x) * Math.pow(gamma, epoch);
        }
        return base_lr;
    }

    function drawGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const type = typeSelect.value;
        const base_lr = parseFloat(baseLrInput.value);
        const max_lr = parseFloat(maxLrInput.value);
        const step_size = parseInt(stepSizeInput.value);
        const total_epochs = 100;

        // Draw Grid Lines
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for(let i=0; i<=10; i++) {
            // Y axis grid
            ctx.beginPath();
            ctx.moveTo(0, i * (canvas.height/10));
            ctx.lineTo(canvas.width, i * (canvas.height/10));
            ctx.stroke();
            // X axis grid
            ctx.beginPath();
            ctx.moveTo(i * (canvas.width/10), 0);
            ctx.lineTo(i * (canvas.width/10), canvas.height);
            ctx.stroke();
        }

        // Calculate points
        let points = [];
        // Determine the absolute max value to scale the Y axis properly
        let graph_max_y = Math.max(max_lr, base_lr) * 1.1; 

        for (let epoch = 0; epoch <= total_epochs; epoch++) {
            let lr = calculateLR(epoch, type, base_lr, max_lr, step_size);
            
            // Map to canvas coordinates
            let xPos = (epoch / total_epochs) * canvas.width;
            let yPos = canvas.height - ((lr / graph_max_y) * canvas.height);
            
            points.push({x: xPos, y: yPos});
        }

        // Draw the line
        ctx.beginPath();
        ctx.strokeStyle = '#0ea5e9'; // Light blue
        ctx.lineWidth = 3;
        
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        
        // Optional: Fill under the curve
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fillStyle = 'rgba(14, 165, 233, 0.1)';
        ctx.fill();
    }

    // Event Listeners
    [typeSelect, baseLrInput, maxLrInput, stepSizeInput].forEach(el => {
        el.addEventListener('input', () => {
            updateLabels();
            drawGraph();
        });
    });

    // Init
    updateLabels();
    drawGraph();
</script>
</body>
</html>
